# The following project is based on the original work by Honglun Yuan et al.
# Original repository: https://github.com/yuanhonglun/WTV_2.0
# Original publication: https://doi.org/10.1016/j.molp.2024.04.012
# This project is licensed under the GPL-3.0 License.

[project]
name = "wtv"
version = "0.3.0"
description = "A library and CLI for ion selection in mass spectrometry data."
authors = [{name = "RECETOX"}]
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=2",
    "pandas>=2.2.3",
    "matchms>=0.30.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "black>=25.1.0",
    "ruff>=0.9.7",
    "pre-commit>=4.2.0",
    "isort>=6.0.1",
    "parameterized>=0.9.0",
    "bump-my-version>=1.8.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.13",
]

[project.scripts]
wtv-cli = "wtv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wtv"]

# Version bumping. [project].version above is the only place the version is
# declared: the tool reads it from the PEP 621 metadata, so there is no second
# copy to keep in sync. See docs/releasing.md for the release workflow.
[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
# Refuse to bump rather than silently skipping a file whose marker moved, e.g.
# if uv changes how it records the root package in the lock file.
ignore_missing_version = false
# A release branch is committed and reviewed as a pull request, so the commits
# and the tag are made by hand and not by the tool.
commit = false
tag = false
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
allow_dirty = false

# uv records the version of the root (editable) package in the lock file, so
# the lock has to move with the declaration above.
[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''
name = "wtv"
version = "{current_version}"
'''
replace = '''
name = "wtv"
version = "{new_version}"
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults
]

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
