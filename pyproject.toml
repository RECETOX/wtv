# The following project is based on the original work by Honglun Yuan et al.
# Original repository: https://github.com/yuanhonglun/WTV_2.0
# Original publication: https://doi.org/10.1016/j.molp.2024.04.012
# This project is licensed under the GPL-3.0 License.

[project]
name = "wtv"
version = "0.2.1"
description = "A library and CLI for ion selection in mass spectrometry data."
authors = [{name = "RECETOX"}]
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=2",
    "pandas>=2.2.3",
    "matchms>=0.30.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "black>=25.1.0",
    "ruff>=0.9.7",
    "pre-commit>=4.2.0",
    "isort>=6.0.1",
    "parameterized>=0.9.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.13",
]

[project.scripts]
wtv-cli = "wtv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wtv"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults
]

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
